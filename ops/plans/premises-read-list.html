<style>
:root{
  --bg:#f6f5f1; --card:#fffefb; --ink:#191a17; --muted:#63665e; --line:#dedcd3; --soft:#eeece4;
  --attach:#1f5f4a; --attach-bg:#e2f0ea; --merge:#8a3b12; --merge-bg:#f8e7dc; --leave:#3d4350; --leave-bg:#e6e8ec;
  --warn:#9a2a1c;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header.top{position:sticky;top:0;z-index:5;background:rgba(246,245,241,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
.count{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;font-variant-numeric:tabular-nums}
.chip{padding:3px 9px;border-radius:999px;font-size:13px;font-weight:600;background:var(--soft);color:var(--muted)}
.chip.attach{background:var(--attach-bg);color:var(--attach)} .chip.merge{background:var(--merge-bg);color:var(--merge)} .chip.leave{background:var(--leave-bg);color:var(--leave)}
main{max-width:1080px;margin:0 auto;padding:16px 16px 40px}
.key{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 22px}
.key div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted)}
.key b{display:block;color:var(--ink);margin-bottom:2px}
.key .attach b{color:var(--attach)} .key .merge b{color:var(--merge)} .key .leave b{color:var(--leave)}
section{margin:0 0 26px}
.ghead{display:flex;gap:8px 14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px}
.ghead h2{font-size:16px;margin:0;font-weight:650}
.ghead .num{color:var(--muted);font-weight:500}
.ghead p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:64ch}
.gtext{flex:1 1 380px}
.all{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;min-height:36px;font-size:14px;font-weight:600}
button:hover{border-color:#b9b6aa}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.small{min-height:32px;padding:0 10px;font-size:13px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 250px;gap:6px 16px;align-items:start}
.row.done{border-color:#c9c6ba}
.n{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.lab{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:650;margin-bottom:2px}
.name{font-weight:620;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13.5px}
.src{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.src span{font-size:11.5px;font-weight:650;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--muted)}
.main + .main{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.ties{grid-column:2 / 4;font-size:13.5px;color:var(--muted);margin-top:2px}
.ties b{color:var(--ink);font-weight:600}
.ties .against{color:var(--warn);font-weight:600}
.act{grid-column:4;grid-row:1 / span 2;display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{padding:0;min-height:44px}
button[data-d="attach"][aria-pressed="true"]{background:var(--attach);border-color:var(--attach);color:#fff}
button[data-d="merge"][aria-pressed="true"]{background:var(--merge);border-color:var(--merge);color:#fff}
button[data-d="leave"][aria-pressed="true"]{background:var(--leave);border-color:var(--leave);color:#fff}
.note{width:100%;font:inherit;font-size:13.5px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-height:36px}
.out{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.out h2{font-size:16px;margin:0 0 4px}
.out p{margin:0 0 10px;color:var(--muted);font-size:14px}
textarea{width:100%;min-height:150px;font:13.5px/1.5 ui-monospace,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);resize:vertical}
.outbar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.primary{background:var(--ink);color:#fff;border-color:var(--ink);min-height:44px;padding:0 18px}
.primary:hover{border-color:var(--ink);background:#30322c}
.said{font-size:14px;color:var(--attach);font-weight:600}
@media (max-width:860px){
  .row{grid-template-columns:30px minmax(0,1fr);}
  .row > .col{grid-column:2}
  .ties{grid-column:2}
  .act{grid-column:1 / -1;grid-row:auto}
  .key{grid-template-columns:1fr}
  .count{margin-left:0}
}
</style>
</head>

  const src = el("div", "src");
  (p.src.length ? p.src : ["no register"]).forEach(s => src.append(el("span", "", s.replace("_", "-"))));
  col.append(src);
  return col;
}

function setRow(n, d) {
  const cur = state[n] || {};
  state[n] = { ...cur, d: cur.d === d ? undefined : d };
  paintRow(n); totals(); save();
}
function paintRow(n) {
  const row = document.getElementById("row-" + n);
  const d = (state[n] || {}).d;
  row.classList.toggle("done", !!d);
  row.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.d === d)));
}

const groups = document.getElementById("groups");
DATA.forEach(g => {
  const sec = el("section");
  const head = el("div", "ghead");
  const text = el("div", "gtext");
  const h = el("h2", "", g.title + " ");
  h.append(el("span", "num", `${g.items[0].n} to ${g.items[g.items.length - 1].n}`));
  text.append(h, el("p", "", g.why + (g.sug ? ` I would ${g.sug} these.` : "")));
  const all = el("div", "all");
  all.append(el("span", "", "Set all " + g.items.length + ":"));
  Object.keys(WORDS).forEach(d => {
    const b = el("button", "small", WORDS[d] + (g.sug === d ? " (suggested)" : ""));
    b.onclick = () => { g.items.forEach(it => { state[it.n] = { ...(state[it.n] || {}), d }; paintRow(it.n); }); totals(); save(); };
    all.append(b);
  });
  head.append(text, all);
  sec.append(head);
  g.items.forEach(it => {
    const row = el("div", "row"); row.id = "row-" + it.n;
    row.append(el("div", "n", it.n));
    const a = el("div", "col"); a.append(profile(it.p, "This profile"));
    const b = el("div", "col");
    if (it.mains.length) it.mains.forEach((m, i) => b.append(profile(m, it.mains.length > 1 ? "Main company, copy " + (i + 1) : "Main company")));
    else { const m = el("div", "main"); m.append(el("div", "lab", "Main company"), el("div", "meta", "None. Shares its name with: " + it.sib.join("; "))); b.append(m); }
    const ties = el("div", "ties");
    ties.append(el("b", "", "What ties them: "), document.createTextNode(it.ties.length ? it.ties.join("; ") : "the name only"));
    it.against.forEach(x => { ties.append(document.createTextNode(" ")); ties.append(el("span", "against", "But " + x + ".")); });
    const act = el("div", "act");
    const seg = el("div", "seg"); seg.setAttribute("role", "group"); seg.setAttribute("aria-label", "Decision for row " + it.n);
    Object.keys(WORDS).forEach(d => { const btn = el("button", "", WORDS[d]); btn.dataset.d = d; btn.setAttribute("aria-pressed", "false"); btn.onclick = () => setRow(it.n, d); seg.append(btn); });
    const note = el("input", "note"); note.placeholder = "Note (optional)"; note.setAttribute("aria-label", "Note for row " + it.n);
    note.value = (state[it.n] || {}).note || "";
    note.oninput = () => { state[it.n] = { ...(state[it.n] || {}), note: note.value }; totals(); save(); };
    act.append(seg, note);
    row.append(a, b, ties, act);
    sec.append(row);
  });
  groups.append(sec);
});

function ranges(ns) {
  const out = []; let s = null, p = null;
  ns.forEach(n => { if (s === null) { s = p = n; } else if (n === p + 1) { p = n; } else { out.push(s === p ? "" + s : s + "-" + p); s = p = n; } });
  if (s !== null) out.push(s === p ? "" + s : s + "-" + p);
  return out.join(", ");
}
const ALL = DATA.flatMap(g => g.items.map(it => it.n));
function totals() {
  const by = { attach: [], merge: [], leave: [] }; const notes = [];
  ALL.forEach(n => { const s = state[n] || {}; if (s.d) by[s.d].push(n); if (s.note && s.note.trim()) notes.push(`${n}: ${s.note.trim()}`); });
  const left = ALL.filter(n => !(state[n] || {}).d);
  document.getElementById("c-left").textContent = left.length ? left.length + " to decide" : "All " + ALL.length + " decided";
  Object.keys(by).forEach(d => document.getElementById("c-" + d).textContent = by[d].length + " " + d);
  const lines = ["Sheds and units, my decisions (list of 13 Oct 2026):"];
  Object.keys(by).forEach(d => lines.push(`${d}: ${by[d].length ? ranges(by[d]) : "none"}`));
  lines.push(`not decided: ${left.length ? ranges(left) : "none"}`);
  if (notes.length) lines.push("notes:", ...notes);
  document.getElementById("text").value = lines.join("\n");
}
ALL.forEach(paintRow); totals();

document.getElementById("jump").onclick = () => document.getElementById("result").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
document.getElementById("copy").onclick = async () => {
  const t = document.getElementById("text"); const said = document.getElementById("said");
  try { await navigator.clipboard.writeText(t.value); said.textContent = "Copied. Paste it into the chat."; }
  catch (e) { t.focus(); t.select(); said.textContent = "Selected. Press Ctrl+C, then paste it into the chat."; }
};
document.getElementById("reset").onclick = () => { if (confirm("Clear all 79 decisions and notes?")) { state = {}; save(); location.reload(); } };
</script>
