name: Deploy Production

on:
  # Called by CI on main as its last job, once every check is green, so the
  # images CI built next to the checks are ready by the time this runs.
  workflow_call:
    inputs:
      ref:
        description: Commit to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag, branch, or SHA to deploy
        required: true
        default: main
        type: string

# Every run, called or manual, waits in the GitHub "production" environment for
# the founder's approval. That click is the single human gate in the workflow.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # One deploy at a time, never cancelled mid-way: a second green CI on main
    # queues behind the first instead of racing it on the VPS.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      # Lets the server pull this commit's images from GitHub's registry with
      # the job token. If they are not there (a manual deploy of an older ref,
      # or the image job skipped), the server builds them as before.
      packages: read

    steps:
      - name: Validate deploy target
        run: |
          if [ "${{ secrets.VPS_HOST }}" = "37.49.227.151" ]; then
            echo "Refusing to deploy to forbidden VPS 37.49.227.151"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "VPS_HOST secret is not configured"
            exit 1
          fi

      - name: Checkout smoke helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve expected production commit
        id: pin
        env:
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          git fetch --tags origin "${DEPLOY_REF}"
          EXPECT="$(git rev-parse "FETCH_HEAD^{commit}")"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "sha=${EXPECT}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/sourcebd-web:${EXPECT}" >> "$GITHUB_OUTPUT"
          echo "etl=ghcr.io/${owner}/sourcebd-web:etl-${EXPECT}" >> "$GITHUB_OUTPUT"
          echo "Expected production commit ${EXPECT}"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REF: ${{ steps.pin.outputs.sha }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_IMAGE: ${{ steps.pin.outputs.web }}
          ETL_IMAGE: ${{ steps.pin.outputs.etl }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: DEPLOY_REF,APP_DIR,GITHUB_TOKEN,WEB_IMAGE,ETL_IMAGE
          script_stop: true
          command_timeout: 25m
          script_path: ops/gha_vps_deploy.sh

      - name: Public smoke test
        # Caddy can return 503 for up to one health_interval after the web
        # container is already serving 127.0.0.1:3000 (Deploy Production
        # 31855403484, 15 Aug 2026: SSH deploy succeeded, first public curl
        # got 503, https://sourcebd.net/api/health was 200 seconds later).
        # Retry until the public URL is 200 with the requested commit.
        run: |
          python3 ops/wait_for_http_ok.py \
            --url "http://${{ secrets.VPS_HOST }}/api/health" \
            --attempts 12 \
            --sleep 5 \
            --expect-commit "${{ steps.pin.outputs.sha }}"
          echo "Health check OK on ${{ secrets.VPS_HOST }}"
