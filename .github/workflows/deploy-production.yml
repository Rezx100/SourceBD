name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag, branch, or SHA to deploy
        required: true
        default: main
        type: string

# Production deploys require the GitHub "production" environment (manual approval).
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Validate deploy target
        run: |
          if [ "${{ secrets.VPS_HOST }}" = "37.49.227.151" ]; then
            echo "Refusing to deploy to forbidden VPS 37.49.227.151"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "VPS_HOST secret is not configured"
            exit 1
          fi

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REF: ${{ github.event.inputs.ref }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: DEPLOY_REF,APP_DIR
          script_stop: true
          script: |
            set -Eeuo pipefail
            REPO_DIR="${APP_DIR:-/opt/sourcebd}"
            cd "$REPO_DIR" || { echo "REPO_DIR $REPO_DIR not found"; exit 1; }
            if [ ! -d .git ]; then
              echo "No .git in $REPO_DIR — run first-time VPS migration (docs/ENTERPRISE_DEPLOYMENT.md)"
              exit 1
            fi
            bash ops/deploy_vps.sh --ref="${DEPLOY_REF}" --require-git

      - name: Public smoke test
        # Caddy can return 503 for up to one health_interval after the web
        # container is already serving 127.0.0.1:3000 (Deploy Production
        # 31855403484, 15 Aug 2026: SSH deploy succeeded, first public curl
        # got 503, https://sourcebd.net/api/health was 200 seconds later).
        # Retry until the public URL is 200 or we exhaust the window.
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          URL="http://${HOST}/api/health"
          attempt=0
          until body="$(curl --fail --silent --show-error --max-time 15 "$URL")"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 12 ]; then
              echo "Public health still failing after ${attempt} attempts at ${URL}"
              exit 1
            fi
            echo "Health not ready (attempt ${attempt}/12), retrying in 5s..."
            sleep 5
          done
          printf '%s\n' "$body"
          echo "Health check OK on ${HOST}"
