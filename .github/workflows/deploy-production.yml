name: Deploy Production

on:
  # Runs after CI has passed on main, never in parallel with it: a squash that
  # goes red on main (checks are non-strict, so two green PRs can still
  # conflict) must not reach the approval step at all.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag, branch, or SHA to deploy
        required: true
        default: main
        type: string

# One deploy at a time, never cancelled mid-way: a second green CI on main
# queues behind the first instead of racing it on the VPS.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Every run, push or manual, waits in the GitHub "production" environment for
# the founder's approval. That click is the single human gate in the workflow.
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read

    steps:
      - name: Validate deploy target
        run: |
          if [ "${{ secrets.VPS_HOST }}" = "37.49.227.151" ]; then
            echo "Refusing to deploy to forbidden VPS 37.49.227.151"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "VPS_HOST secret is not configured"
            exit 1
          fi

      - name: Checkout smoke helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve expected production commit
        id: pin
        env:
          # After CI on main: the commit CI just passed. Manual: the ref typed in.
          DEPLOY_REF: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha }}
        run: |
          git fetch --tags origin "${DEPLOY_REF}"
          EXPECT="$(git rev-parse "FETCH_HEAD^{commit}")"
          echo "sha=${EXPECT}" >> "$GITHUB_OUTPUT"
          echo "Expected production commit ${EXPECT}"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REF: ${{ steps.pin.outputs.sha }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: DEPLOY_REF,APP_DIR,GITHUB_TOKEN
          script_stop: true
          command_timeout: 25m
          script_path: ops/gha_vps_deploy.sh

      - name: Public smoke test
        # Caddy can return 503 for up to one health_interval after the web
        # container is already serving 127.0.0.1:3000 (Deploy Production
        # 31855403484, 15 Aug 2026: SSH deploy succeeded, first public curl
        # got 503, https://sourcebd.net/api/health was 200 seconds later).
        # Retry until the public URL is 200 with the requested commit.
        run: |
          python3 ops/wait_for_http_ok.py \
            --url "http://${{ secrets.VPS_HOST }}/api/health" \
            --attempts 12 \
            --sleep 5 \
            --expect-commit "${{ steps.pin.outputs.sha }}"
          echo "Health check OK on ${{ secrets.VPS_HOST }}"
