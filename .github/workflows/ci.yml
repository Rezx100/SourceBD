name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # Placeholder public vars only — no real secrets in CI
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://sourcebd.net
          NEXT_PUBLIC_SITE_URL: https://sourcebd.net

  unit-tests:
    # The node --test suite (tsc -p tsconfig.npm-test.json, then every
    # *.test.js it emits) ran nowhere but the author's machine, so a commit
    # that broke it landed on a green CI. Three commits on the dashboard-kit
    # branch did exactly that: each was meant to touch markdown only, each
    # swept up a source file a concurrent mutation run had rewritten, and the
    # branch sat red for two commits with every CI check passing.
    #
    # Node 22, not 20. `pnpm test` passes ".tests-build/**/*.test.js" to
    # `node --test`, and Node 20 has no glob support there: it looks for a
    # file of that literal name, prints "Could not find", and exits 1 without
    # running anything. CLAUDE.md's "Node 20 only" is wrong; 21 and 22 both
    # run the suite.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  http-boundary:
    # REZ-72 durable guard: asserts the supplier profile miss path emits real
    # 404/308 statuses on the wire (not a streamed soft-200). The script
    # builds the app against a local Supabase stub and probes it over HTTP.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Profile HTTP-boundary guard
        run: node scripts/test-profile-http-boundary.mjs --build

  migrations:
    # The 1,052 lines of `0104_discover_v32.sql` were never executed by
    # anything. Four rounds of review read the file; round 4 found a doubled
    # comma that Postgres rejects at CREATE FUNCTION time, so the migration
    # would not have applied at all — and it had passed a guard written to
    # check that exact ORDER BY, because the guard matched source text rather
    # than running it. This job replays every migration against a throwaway
    # Postgres 16 and then asserts the behaviour that matters, by calling the
    # functions. See supabase/ci/.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sourcebd_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: sourcebd_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replay every migration, then assert 0104 behaves
        run: bash supabase/ci/apply-migrations.sh
