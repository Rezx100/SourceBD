services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: sourcebd-web:latest
    env_file: .env
    restart: unless-stopped
    ports:
      # Bind to localhost only; Caddy on the host fronts public :80.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  etl:
    build: .
    image: sourcebd-etl:latest
    env_file: .env
    volumes:
      - ./etl/raw:/app/etl/raw
      - ./etl/parsed:/app/etl/parsed
      - ./etl/logs:/app/etl/logs
    working_dir: /app
