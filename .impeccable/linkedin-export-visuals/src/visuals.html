<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SourceBD export visuals</title>
<!-- LinkedIn visuals from SourceBD's customs export data. Grounds, ink and type are the marketing site's
     (homeGrounds and the site-* scale in lib/design/tokens.ts, Geist from app/fonts); green is the wordmark and
     the one button. render.cjs shoots every .art at 2x and prints the carousel to a PDF. -->
<style>
  @font-face { font-family: "Geist"; src: url("../../../app/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("../../../app/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #2b2b2b; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; font-family: "Geist", ui-sans-serif, system-ui; }
  body.print { background: none; padding: 0; gap: 0; display: block; }
  .art { position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--ground); color: var(--ink);
         font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; }
  .print .art { break-after: page; }
  .night { --ground: #171721; --raised: #1E1E2A; --ink: #EDEDF3; --ink2: #C3C3CC; --ink3: #9696A3; --line: #4E4F5F; --rule: #70707D; --mark: #8BE39A; }
  .warm  { --ground: #F6F5F1; --raised: #EEEDE8; --ink: #2A2924; --ink2: #5A5548; --ink3: #6E695C; --line: #DAD8D0; --rule: #B9B5AA; --mark: #1B5E20; }
  .day   { --ground: #FBFCFE; --raised: #F0F1F5; --ink: #272735; --ink2: #535461; --ink3: #71727F; --line: #DCDDE5; --rule: #B8B9C6; --mark: #1B5E20; }

  .portrait { width: 1080px; height: 1350px; padding: 84px 88px 72px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  .wordmark { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; color: var(--mark); }
  .pager { font-family: "Geist Mono"; font-size: 22px; color: var(--ink3); letter-spacing: 0.02em; }
  h1, h2 { font-weight: 400; color: var(--ink); text-wrap: balance; }
  h2 { font-size: 74px; line-height: 1.04; letter-spacing: -0.032em; margin-top: 76px; }
  h1 { font-size: 88px; line-height: 1.0; letter-spacing: -0.036em; margin-top: 96px; }
  .sub { font-size: 31px; line-height: 1.38; color: var(--ink2); margin-top: 28px; max-width: 860px; text-wrap: pretty; }
  .chart { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 44px 0 40px; }
  .foot { border-top: 1px solid var(--line); padding-top: 22px; font-size: 21px; line-height: 1.45; color: var(--ink3); }
  .foot b { font-weight: 500; color: var(--ink2); }
  .mono { font-family: "Geist Mono"; }

  /* Reach bars */
  .bars { display: grid; grid-template-columns: 1fr; gap: 30px; }
  .bar-row { display: grid; grid-template-columns: 1fr auto; row-gap: 12px; align-items: baseline; }
  .bar-row .name { font-size: 32px; color: var(--ink); }
  .bar-row .val { font-family: "Geist Mono"; font-size: 34px; color: var(--ink); text-align: right; }
  .bar-row .val small { font-size: 21px; color: var(--ink3); margin-right: 18px; }
  .track { grid-column: 1 / -1; height: 26px; background: var(--raised); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--rule); border-radius: 4px; }
  .fill.hi { background: var(--ink); }
  .divider { border-top: 1px solid var(--line); margin: 6px 0 2px; }

  /* Value split */
  .stack { display: flex; gap: 4px; height: 132px; }
  .stack div { height: 100%; border-radius: 4px; background: var(--ink); }
  .legend { margin-top: 44px; display: grid; gap: 0; }
  .legend-row { display: grid; grid-template-columns: 28px 1fr 200px 120px; align-items: center; column-gap: 20px;
                padding: 18px 0; border-top: 1px solid var(--line); font-size: 32px; }
  .legend-row:last-child { border-bottom: 1px solid var(--line); }
  .sw { width: 28px; height: 28px; border-radius: 4px; background: var(--ink); }
  .legend-row .usd, .legend-row .pct { font-family: "Geist Mono"; text-align: right; }
  .legend-row .usd { font-size: 26px; color: var(--ink3); }

  /* Unit grid */
  .unitwrap { display: grid; grid-template-columns: auto 1fr; column-gap: 64px; align-items: center; }
  .units { display: grid; gap: var(--gap); grid-template-columns: repeat(10, var(--sq)); }
  .units i { width: var(--sq); height: var(--sq); border-radius: 3px; border: 2px solid var(--line); }
  .units i.on { background: var(--ink); border-color: var(--ink); }
  .facts { display: grid; gap: 44px; }
  .fact .fig { font-size: 64px; line-height: 1; letter-spacing: -0.03em; color: var(--ink); }
  .fact .fig small { font-size: 32px; color: var(--ink3); letter-spacing: -0.01em; }
  .fact p { font-size: 26px; line-height: 1.35; color: var(--ink2); margin-top: 12px; }

  /* Price ranges */
  .prices { display: grid; gap: 12px; }
  .price-row .top { display: flex; justify-content: space-between; align-items: baseline; }
  .price-row .name { font-size: 26px; color: var(--ink); }
  .price-row .name small { font-family: "Geist Mono"; font-size: 18px; color: var(--ink3); margin-left: 12px; }
  .price-row .val { font-family: "Geist Mono"; font-size: 30px; color: var(--ink); }
  .price-row svg { display: block; margin-top: 4px; }
  .axis { display: flex; justify-content: space-between; font-family: "Geist Mono"; font-size: 19px; color: var(--ink3); margin-top: 10px; position: relative; height: 24px; }
  .axis span { position: absolute; transform: translateX(-50%); }

  /* Deciles */
  .cols { display: flex; align-items: flex-end; justify-content: space-between; height: 400px; border-bottom: 1px solid var(--rule); }
  .col { width: 72px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .col span { font-family: "Geist Mono"; font-size: 22px; color: var(--ink2); margin-bottom: 10px; white-space: nowrap; }
  .col div { width: 100%; background: var(--line); border-radius: 4px 4px 0 0; min-height: 2px; }
  .col.hi div { background: var(--ink); }
  .col.hi span { color: var(--ink); font-size: 30px; }
  .xlab { display: flex; justify-content: space-between; font-size: 22px; color: var(--ink3); margin-top: 14px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 44px; }
  .pair .fig { font-size: 60px; letter-spacing: -0.03em; line-height: 1; }
  .pair p { font-size: 25px; line-height: 1.35; color: var(--ink2); margin-top: 12px; }

  /* Certificate compare */
  .keys { display: flex; gap: 36px; font-size: 24px; color: var(--ink2); margin-bottom: 36px; }
  .keys span { display: inline-flex; align-items: center; gap: 12px; }
  .keys i { width: 22px; height: 22px; border-radius: 4px; background: var(--ink); display: inline-block; }
  .keys i.off { background: var(--rule); }
  .metric { padding: 26px 0; border-top: 1px solid var(--line); }
    .metric h3 { font-weight: 400; font-size: 30px; color: var(--ink); margin-bottom: 16px; }
  .hb { display: grid; grid-template-columns: 1fr 170px; align-items: center; column-gap: 20px; margin-top: 10px; }
  .hb .t { height: 30px; }
  .hb .t div { height: 100%; border-radius: 4px; background: var(--ink); }
  .hb .t div.off { background: var(--rule); }
  .hb b { font-family: "Geist Mono"; font-weight: 400; font-size: 32px; text-align: right; }
  .hb b.off { color: var(--ink3); }

  /* Close */
  .btn { display: inline-flex; align-items: center; gap: 16px; height: 96px; padding: 0 48px; border-radius: 999px;
         background: #1B5E20; color: #fff; font-size: 34px; font-weight: 500; letter-spacing: -0.01em; }
  .holds { display: grid; gap: 0; margin-top: 8px; }
  .holds div { display: flex; justify-content: space-between; padding: 22px 0; border-top: 1px solid var(--line); font-size: 30px; color: var(--ink); }
  .holds div:last-child { border-bottom: 1px solid var(--line); }
  .holds span { color: var(--ink3); font-size: 24px; }

  /* Link image */
  .wide { width: 1200px; height: 627px; padding: 56px 64px 48px; display: grid; grid-template-columns: 1fr auto; column-gap: 64px; }
  .wide .left { display: flex; flex-direction: column; }
  .wide h2 { font-size: 54px; margin-top: 44px; letter-spacing: -0.028em; }
  .wide .foot { margin-top: auto; font-size: 17px; }
  .wide .units { align-self: center; }
</style>
</head>
<body>
<script src="data.js"></script>
<script>
const D = window.DATA;
const fmt = (n) => n.toLocaleString("en-GB");
const pct = (a, b) => Math.round((100 * a) / b);
const bn = (usd) => "$" + (usd / 1e9).toFixed(2) + " bn";
const mn = (usd) => "$" + (usd / 1e6).toFixed(1) + " m";
const arrow = `<svg width="40" height="40" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/></svg>`;
const SOURCE = `Source: Bangladesh customs export records for knitted and woven garments (HS 61–62), ${D.window}, matched to ${D.exporters} exporters verified on SourceBD.`;

// mode "slide" carries the carousel's page number; "card" stands alone and carries the address instead.
function frame({ ground, page, mode = "slide", title, sub = "", chart, note }) {
  const right = mode === "slide" ? `${page} / 8` : "sourcebd.net";
  return `<section class="art portrait ${ground}" data-name="${mode === "slide" ? "carousel-" + String(page).padStart(2, "0") : "card"}">
    <div class="head"><span class="wordmark">SourceBD</span><span class="pager">${right}</span></div>
    <h2>${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ""}
    <div class="chart">${chart}</div>
    <p class="foot">${note ? `<b>${note}</b><br>` : ""}${SOURCE}</p>
  </section>`;
}

function skyline() {
  const W = 904, H = 330, n = D.ships.length, step = W / n, max = Math.log10(D.ships[0] + 1);
  const bars = D.ships.map((s, i) => {
    const h = Math.max(1.5, (Math.log10(s + 1) / max) * H);
    return `<rect x="${(i * step).toFixed(2)}" y="${(H - h).toFixed(2)}" width="${(step * 0.62).toFixed(2)}" height="${h.toFixed(2)}" fill="var(${i < 50 ? "--ink" : "--rule"})"/>`;
  }).join("");
  return `<svg width="${W}" height="${H + 1}" viewBox="0 0 ${W} ${H + 1}">${bars}<rect x="0" y="${H}" width="${W}" height="1" fill="var(--line)"/></svg>
    <div style="display:flex;justify-content:space-between;margin-top:16px;font-size:22px;color:var(--ink3)">
      <span>${D.exporters} exporters, ranked by shipments</span><span class="mono">${bn(D.fobUsd).replace(" bn", " billion")} FOB</span></div>`;
}

function cover() {
  return `<section class="art portrait night" data-name="carousel-01">
    <div class="head"><span class="wordmark">SourceBD</span><span class="pager">1 / 8</span></div>
    <h1>We read ${fmt(D.shipments)} garment shipments out of Bangladesh.</h1>
    <p class="sub">Two years of customs records for ${D.exporters} exporters verified on SourceBD. Six things they tell a buyer in the UK, US, EU or Canada.</p>
    <div class="chart" style="justify-content:flex-end;padding-bottom:56px">${skyline()}</div>
    <p class="foot" style="display:flex;justify-content:space-between;align-items:center"><span>Customs export records, HS 61–62, ${D.window}</span><span style="display:inline-flex;align-items:center;gap:14px;color:var(--ink)">Swipe ${arrow}</span></p>
  </section>`;
}

function reach(mode) {
  const row = (name, n, hi) => `<div class="bar-row"><span class="name">${name}</span><span class="val"><small>${n} of ${D.exporters}</small>${pct(n, D.exporters)}%</span>
    <div class="track"><div class="fill ${hi ? "hi" : ""}" style="width:${(100 * n) / D.exporters}%"></div></div></div>`;
  const chart = `<div class="bars">${D.reach.map((r, i) => row(r.k, r.n, i === 0)).join("")}<div class="divider"></div>${row("All four markets", D.reachAll4, true)}</div>`;
  return frame({ ground: "warm", page: 2, mode, title: "9 in 10 already ship to the EU. Fewer than half reach all four of your markets.",
    chart, note: `Exporters with at least one shipment to each market. ${D.exporters} exporters.` });
}

function value(mode) {
  const tones = [1, 0.62, 0.4, 0.24, 0.13];
  const stack = `<div class="stack">${D.value.map((v, i) => `<div style="flex:${v.pct};opacity:${tones[i]}"></div>`).join("")}</div>`;
  const legend = `<div class="legend">${D.value.map((v, i) => `<div class="legend-row"><span class="sw" style="opacity:${tones[i]}"></span><span>${v.k}</span><span class="usd">${bn(v.usd)}</span><span class="pct">${v.pct.toFixed(1)}%</span></div>`).join("")}</div>`;
  return frame({ ground: "day", page: 3, mode, title: "Half the money goes to the EU. The UK takes one dollar in seven.",
    chart: stack + legend, note: `Share of ${bn(D.fobUsd).replace(" bn", " billion")} FOB, ${D.exporters} exporters, ${fmt(D.shipments)} shipment records.` });
}

function units(on, sq, gap) {
  return `<div class="units" style="--sq:${sq}px;--gap:${gap}px">${Array.from({ length: 100 }, (_, i) => `<i class="${i < on ? "on" : ""}"></i>`).join("")}</div>`;
}

function small(mode) {
  const s = D.small, share = Math.round((100 * s.smallRecords) / s.records);
  const chart = `<div class="unitwrap">${units(share, 50, 10)}
    <div class="facts">
      <div class="fact"><div class="fig">${share}<small> in 100</small></div><p>shipment records were under 1,000 pieces.</p></div>
      <div class="fact"><div class="fig">${s.anySmall}<small> of ${s.exporters}</small></div><p>exporters shipped at least one order that small.</p></div>
    </div></div>`;
  return frame({ ground: "warm", page: 4, mode, title: "Nearly half of all shipments were under 1,000 pieces.",
    sub: "Bangladesh is not only for 50,000-piece programmes. Small runs already move through the same factories.",
    chart, note: `${fmt(s.smallRecords)} of ${fmt(s.records)} shipment records with a filed quantity under 1,000. ${s.exporters} exporters.` });
}

function price(mode) {
  const W = 904, max = 24, x = (v) => (v / max) * W;
  const rows = D.price.map((p) => `<div class="price-row">
      <div class="top"><span class="name">${p.k}<small>${p.n} records</small></span><span class="val">$${p.q[1].toFixed(2)}</span></div>
      <svg width="${W}" height="20" viewBox="0 0 ${W} 20"><rect x="0" y="9" width="${W}" height="2" fill="var(--line)"/>
        <rect x="${x(p.q[0])}" y="4" width="${x(p.q[2]) - x(p.q[0])}" height="12" rx="6" fill="var(--rule)"/>
        <circle cx="${x(p.q[1])}" cy="10" r="10" fill="var(--ink)"/></svg></div>`).join("");
  const axis = `<div class="axis">${[0, 5, 10, 15, 20].map((v) => `<span style="left:${(v / max) * 100}%;${v === 0 ? "transform:none" : ""}">$${v}</span>`).join("")}</div>`;
  return frame({ ground: "day", page: 5, mode, title: "What a piece costs at the factory gate.",
    chart: `<div class="prices">${rows}</div>${axis}`, note: `Median FOB per piece; the bar is the middle half of prices. ${fmt(D.priceRecords)} recent shipment records from ${D.exporters} exporters.` });
}

function concentration(mode) {
  const H = 340, top = D.deciles[0];
  const cols = D.deciles.map((p, i) => `<div class="col ${i === 0 ? "hi" : ""}"><span>${p < 0.1 ? "<0.1" : p.toFixed(1)}%</span><div style="height:${Math.max(2, (p / top) * H)}px"></div></div>`).join("");
  const chart = `<div class="cols">${cols}</div><div class="xlab"><span>Top tenth of exporters</span><span>Bottom tenth</span></div>
    <div class="pair"><div><div class="fig">${D.top50MedianBuyers}</div><p>buyers for the typical exporter in the top 50</p></div>
      <div><div class="fig">${D.restMedianBuyers}</div><p>buyers in ${D.restMedianCountries} countries for the typical exporter among the other ${D.exporters - 50}</p></div></div>`;
  return frame({ ground: "night", page: 6, mode, title: "Half the value ships from 50 exporters. There are 446 more.",
    chart, note: `Share of FOB value by tenth of exporters, ranked by value. Typical = median. ${D.exporters} exporters.` });
}

function cert(mode) {
  const c = D.cert;
  const metric = (label, a, b, max, f) => `<div class="metric"><h3>${label}</h3>
    <div class="hb"><div class="t"><div style="width:${(100 * a) / max}%"></div></div><b>${f(a)}</b></div>
    <div class="hb"><div class="t"><div class="off" style="width:${Math.max(0.6, (100 * b) / max)}%"></div></div><b class="off">${f(b)}</b></div></div>`;
  const chart = `<div class="keys"><span><i></i>Current certificate on file · ${c.with.n}</span><span><i class="off"></i>None on file · ${c.without.n}</span></div>
    ${metric("Buyers served, typical exporter", c.with.buyers, c.without.buyers, 60, (v) => v)}
    ${metric("Ship to all four: UK, US, EU, Canada", c.with.all4, c.without.all4, 100, (v) => v + "%")}
    ${metric("FOB value over two years, typical exporter", c.with.fob, c.without.fob, 30e6, mn)}`;
  return frame({ ground: "warm", page: 7, mode, title: "Exporters with a current certificate reach five times as many buyers.",
    chart, note: `Certificates: OEKO-TEX, GOTS or WRAP, current on the supplier's SourceBD record. Typical = median. A link, not proof of cause.` });
}

function close() {
  return `<section class="art portrait night" data-name="carousel-08">
    <div class="head"><span class="wordmark">SourceBD</span><span class="pager">8 / 8</span></div>
    <h2>See who a factory ships to before you send the RFQ.</h2>
    <p class="sub">SourceBD keeps every verified Bangladesh supplier's record in one place, each fact with the register it came from.</p>
    <div class="chart"><div class="holds">
      <div>Government and industry registers<span>BGMEA, BKMEA, EPB, RJSC</span></div>
      <div>Certificates and their expiry<span>OEKO-TEX, GOTS, WRAP</span></div>
      <div>Safety and sanctions checks<span>RSC, US, UK, EU lists</span></div>
      <div>Export history<span>markets, buyers, recent shipments</span></div>
    </div></div>
    <div style="margin-bottom:64px"><span class="btn">Start free at sourcebd.net ${arrow}</span></div>
    <p class="foot">${SOURCE}</p>
  </section>`;
}

function link() {
  const s = D.small, share = Math.round((100 * s.smallRecords) / s.records);
  return `<section class="art wide night" data-name="link-1200x627">
    <div class="left"><span class="wordmark" style="font-size:30px">SourceBD</span>
      <h2>Nearly half of Bangladesh garment shipments were under 1,000 pieces.</h2>
      <p class="sub" style="font-size:24px;margin-top:20px">${fmt(s.smallRecords)} of ${fmt(s.records)} customs shipment records, ${D.window}.</p>
      <p class="foot">${s.exporters} exporters verified on SourceBD · HS 61–62</p></div>
    ${units(share, 40, 8)}
  </section>`;
}

const print = new URLSearchParams(location.search).get("print") === "carousel";
if (print) document.body.classList.add("print");
const slides = [cover(), reach("slide"), value("slide"), small("slide"), price("slide"), concentration("slide"), cert("slide"), close()];
const cards = [small("card"), price("card"), cert("card")].map((h, i) => h.replace('data-name="card"', `data-name="card-${["small-orders", "price-per-piece", "certificates"][i]}"`));
document.body.insertAdjacentHTML("beforeend", (print ? slides : [...slides, ...cards, link()]).join(""));
</script>
</body>
</html>
