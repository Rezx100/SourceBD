[project]
name = "sourcebd-etl"
version = "0.1.0"
description = "SourceBD enterprise scraping & enrichment pipeline"
requires-python = ">=3.10"
dependencies = [
  "httpx[http2]>=0.27",
  "tenacity>=9.0",
  "pdfplumber>=0.11",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "playwright==1.47.*",
  "rapidfuzz>=3.9",
  "python-slugify>=8.0",
  "Unidecode>=1.3",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.4",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "tldextract>=5.1",
  "urllib3>=2.2",
  "pandas>=2.2",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.3", "pytest-asyncio>=0.23"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
sourcebd-etl = "etl.cli:app"
